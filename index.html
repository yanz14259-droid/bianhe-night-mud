<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#15130f">
  <meta name="format-detection" content="telephone=no">
  <title>汴河夜雨 · 文字武侠 MUD</title>
  <style>
    :root{
      --ink:#26221b;--ink-2:#5b5141;--paper:#eee4ca;--paper-2:#d9c9a4;
      --night:#15130f;--night-2:#221e18;--gold:#bd9451;--gold-2:#e0c183;
      --red:#8e312b;--green:#56725a;--blue:#526b78;--line:rgba(74,61,41,.3);
      --fs:16px;--radius:14px;--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;font-size:var(--fs)}
    body{overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button{touch-action:manipulation}
    .hidden{display:none!important}
    .app{width:min(100%,720px);min-height:100dvh;margin:0 auto;background:
      radial-gradient(circle at 20% 0,rgba(191,155,94,.18),transparent 34%),
      linear-gradient(90deg,rgba(50,40,25,.06) 1px,transparent 1px),
      var(--paper);background-size:auto,22px 22px,auto;position:relative;box-shadow:0 0 60px #000}
    .paper-noise:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;z-index:50;background-image:radial-gradient(#2f281e .5px,transparent .7px);background-size:4px 4px}
    .screen{min-height:100dvh}
    .landing{padding:28px 20px calc(24px + var(--safe-bottom));display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;color:#eadfc4;background:
      linear-gradient(rgba(15,14,12,.84),rgba(15,14,12,.94)),
      radial-gradient(circle at 70% 15%,#7b6948,transparent 33%),
      linear-gradient(145deg,#211f19,#0e0d0b)}
    .landing:after{content:"汴";position:absolute;right:-26px;bottom:-70px;font-size:270px;color:rgba(207,172,106,.045);font-weight:700}
    .seal{align-self:flex-start;border:1px solid #b65b4e;color:#d98472;padding:4px 9px;letter-spacing:.12em;font-size:12px;transform:rotate(-2deg)}
    .brand{margin:26px 0 8px;font-size:clamp(42px,12vw,72px);line-height:.95;letter-spacing:.12em;color:#f1dfb4;text-shadow:0 3px 18px #000}
    .brand-sub{color:#ad9d7b;letter-spacing:.28em;font-size:13px;margin-bottom:22px}
    .pitch{max-width:32rem;line-height:1.9;color:#d1c5aa;margin:0 0 28px}
    .disclaimer{border-left:2px solid #935149;padding:10px 12px;background:rgba(105,58,48,.13);font-size:12px;line-height:1.65;color:#ad9e80;margin-bottom:24px}
    .landing-actions{display:grid;gap:10px;z-index:1}
    .btn{border:1px solid #604d31;background:#f1e4c4;color:#282116;border-radius:10px;min-height:48px;padding:11px 16px;cursor:pointer;box-shadow:0 3px 0 rgba(45,35,22,.18);transition:.18s transform,.18s background}
    .btn:active{transform:translateY(2px);box-shadow:none}
    .btn.primary{background:linear-gradient(#c9a565,#a98242);color:#17130d;border-color:#e1c486;font-weight:700}
    .btn.ghost{background:transparent;color:#c9bb9d;border-color:#685f4c}
    .btn.danger{color:#7b2521;border-color:#9f5e55;background:#f0dbce}
    .btn.small{min-height:38px;padding:7px 11px;font-size:13px}
    .btn:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
    .continue-note{font-size:12px;color:#8e8065;text-align:center;margin-top:8px}

    .creator{padding:20px 16px calc(30px + var(--safe-bottom));background:var(--paper);min-height:100dvh}
    .creator-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
    .creator-head h2{margin:0;font-size:24px;letter-spacing:.1em}
    .step-mark{margin-left:auto;font-size:12px;color:var(--ink-2)}
    .form-grid{display:grid;gap:14px}
    label.field{display:grid;gap:7px;color:var(--ink-2);font-size:13px}
    .field input,.field select{width:100%;border:1px solid #aa9873;border-radius:8px;background:rgba(255,250,235,.65);padding:12px;color:var(--ink);outline:none}
    .field input:focus,.field select:focus{border-color:#8e6531;box-shadow:0 0 0 3px rgba(161,118,59,.13)}
    .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .choice-card{border:1px solid #aa9873;border-radius:10px;background:rgba(255,250,235,.5);padding:12px;text-align:left;color:var(--ink);min-height:84px;cursor:pointer}
    .choice-card.selected{border:2px solid #8e312b;padding:11px;background:#f3e5c7;box-shadow:0 4px 14px rgba(77,48,22,.12)}
    .choice-card b{display:block;font-size:16px;margin-bottom:6px}
    .choice-card span{display:block;font-size:12px;line-height:1.55;color:var(--ink-2)}
    .school-grid .choice-card{min-height:102px}
    .creator-actions{display:flex;gap:10px;margin-top:20px}.creator-actions .btn{flex:1}

    .game{padding-bottom:calc(78px + var(--safe-bottom));min-height:100dvh}
    .statusbar{position:sticky;top:0;z-index:20;background:rgba(22,20,16,.97);color:#e9ddc0;padding:10px 12px;border-bottom:1px solid #5e4c30;box-shadow:0 5px 18px rgba(0,0,0,.24)}
    .status-top{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border:1px solid #9d7740;border-radius:50%;display:grid;place-items:center;color:#e1c181;background:#2a251c;font-weight:700}
    .who{min-width:0;flex:1}.who b{font-size:15px}.who small{display:block;color:#a99977;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .place{font-size:12px;color:#c6b48f;max-width:88px;text-align:right}
    .bars{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
    .bar{height:8px;background:#393329;border-radius:9px;overflow:hidden;position:relative}.bar i{display:block;height:100%;transition:width .3s}.bar.hp i{background:linear-gradient(90deg,#7d2824,#c8584d)}.bar.mp i{background:linear-gradient(90deg,#405d68,#68a0a8)}
    .bar-labels{display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:10px;color:#b9aa8c;margin-top:3px}
    .scene{padding:18px 15px 8px}
    .chapter-kicker{font-size:11px;color:#8b6332;letter-spacing:.18em;margin-bottom:5px}
    .scene h1{font-size:25px;margin:0 0 13px;letter-spacing:.06em}
    .story-text{font-size:1em;line-height:1.92;color:#302a20;white-space:pre-line}
    .story-text .dialogue{display:block;border-left:2px solid #9f7c48;padding:8px 12px;background:rgba(255,250,238,.58);margin:12px 0;color:#4a3823}
    .delta-log{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
    .delta{font-size:11px;padding:4px 7px;border-radius:20px;background:#ded0ad;color:#5d4a2e}.delta.good{background:#cbd8c5;color:#37513a}.delta.bad{background:#dfc0b6;color:#6f2e28}
    .choices{padding:8px 15px 22px;display:grid;gap:10px}
    .choice-btn{width:100%;border:1px solid #8e7a56;border-radius:11px;background:rgba(249,241,219,.84);color:#2d261c;text-align:left;min-height:55px;padding:12px 42px 12px 14px;position:relative;box-shadow:0 3px 9px rgba(76,55,27,.08);cursor:pointer;line-height:1.45}
    .choice-btn:after{content:"›";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#9b6b2c;font-size:26px}
    .choice-btn small{display:block;margin-top:5px;color:#806f54}.choice-btn.locked{opacity:.52}.choice-btn.hidden-choice{border-style:dashed;background:#e8ddc3}
    .choice-btn.combat{border-color:#9b5a51}.choice-btn.combat:after{color:#9a332d}

    .bottom-nav{position:fixed;z-index:25;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);display:flex;overflow-x:auto;background:rgba(24,22,18,.98);border-top:1px solid #665338;padding:6px 5px calc(6px + var(--safe-bottom));scrollbar-width:none}
    .bottom-nav::-webkit-scrollbar{display:none}.nav-btn{flex:0 0 64px;border:0;background:transparent;color:#b8aa8d;font-size:11px;padding:5px 2px;min-height:50px;cursor:pointer}.nav-btn i{display:block;font-style:normal;font-size:19px;color:#d0b47c;margin-bottom:3px}

    .modal-wrap{position:fixed;z-index:40;inset:0;background:rgba(12,11,9,.67);display:flex;align-items:flex-end;justify-content:center}
    .modal{width:min(100%,720px);max-height:88dvh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -10px 35px rgba(0,0,0,.35);padding-bottom:calc(16px + var(--safe-bottom));animation:rise .22s ease}
    @keyframes rise{from{transform:translateY(25px);opacity:.4}}
    .modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;background:rgba(238,228,202,.97);border-bottom:1px solid var(--line);padding:14px 15px}.modal-head h2{margin:0;font-size:20px}.close{margin-left:auto;border:0;background:#d9c9a4;border-radius:50%;width:36px;height:36px;color:#4a3e2e;cursor:pointer}
    .modal-body{padding:14px 15px}
    .tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px;scrollbar-width:none}.tab{border:1px solid #9b8865;background:#eadcba;color:#5a4a32;border-radius:20px;padding:7px 12px;white-space:nowrap;cursor:pointer}.tab.active{background:#6c5130;color:#f6e8c6;border-color:#6c5130}
    .panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat-card,.list-card{border:1px solid #b4a17c;background:rgba(255,250,237,.55);border-radius:10px;padding:11px}
    .stat-card span{font-size:11px;color:#796b54;display:block}.stat-card b{font-size:18px}.section-title{font-size:15px;margin:18px 0 9px;border-left:3px solid #8c6130;padding-left:8px}
    .list{display:grid;gap:9px}.list-card{position:relative}.list-card h3{margin:0 0 5px;font-size:16px}.list-card p{margin:5px 0;font-size:12px;line-height:1.6;color:#625640}.meta-line{display:flex;gap:7px;flex-wrap:wrap;font-size:11px;color:#7a6b51}.tag{border:1px solid #ad956b;border-radius:12px;padding:2px 6px;background:#e8d9b8}.tag.good{border-color:#73886b;color:#3e5d3f}.tag.bad{border-color:#a16c63;color:#7b3029}
    .card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.quality-凡品{color:#716b62}.quality-良品{color:#526d51}.quality-上品{color:#3e6783}.quality-珍品{color:#71538a}.quality-绝品{color:#9b5d1e}.quality-百炼{color:#a5322a}.quality-神兵{color:#bd8321;text-shadow:0 0 8px #deb85d}
    .capacity{font-size:12px;color:#6d5e47;margin-bottom:10px}.locked-mark{position:absolute;right:10px;top:8px;color:#8e312b}
    .empty{padding:28px;text-align:center;color:#887a62;border:1px dashed #b8a884;border-radius:10px}

    .battle-box{margin:12px 15px 4px;border:1px solid #8d7550;border-radius:13px;background:rgba(37,31,23,.93);color:#ebdfc5;padding:13px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
    .enemy-head{display:flex;align-items:center;gap:10px}.enemy-icon{width:42px;height:42px;border:1px solid #9a7340;border-radius:50%;display:grid;place-items:center;color:#e7bd76;background:#1c1914}.enemy-head b{font-size:17px}.enemy-head small{display:block;color:#a99b80;margin-top:3px}.enemy-head .phase{margin-left:auto;color:#e2a75f;font-size:12px}
    .enemy-bar{height:11px;background:#443a2d;border-radius:9px;margin:10px 0 5px;overflow:hidden}.enemy-bar i{display:block;background:linear-gradient(90deg,#8c2b27,#d25a4c);height:100%;transition:width .3s}.enemy-hp-label{text-align:right;font-size:10px;color:#a99b80}
    .status-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.status-pill{font-size:10px;border:1px solid #72634f;border-radius:12px;padding:2px 6px;color:#d4c4a6}
    .battle-log{max-height:145px;overflow:auto;background:rgba(0,0,0,.22);border-radius:8px;padding:8px;margin-top:10px;font-size:12px;line-height:1.55;color:#cdbf9f}.battle-log div+div{margin-top:4px}.hint{color:#e3bd73}
    .battle-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 15px 22px}.battle-actions .btn{min-height:48px}.skill-actions{grid-column:1/-1;display:grid;gap:7px}.skill-btn{background:#e8d4aa}.skill-btn small{display:block;color:#756342;font-size:10px;margin-top:3px}

    .toast-stack{position:fixed;z-index:80;left:50%;top:90px;transform:translateX(-50%);width:min(calc(100% - 30px),520px);display:grid;gap:7px;pointer-events:none}
    .toast{background:rgba(28,24,18,.94);color:#eadab6;border:1px solid #806238;padding:10px 13px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastIn .25s ease;font-size:13px}.toast.good{border-color:#688060}.toast.bad{border-color:#914d45}@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}
    .ending{padding:30px 18px calc(110px + var(--safe-bottom));text-align:center;background:linear-gradient(rgba(239,228,200,.91),rgba(226,210,170,.97));min-height:calc(100dvh - 96px)}
    .ending-seal{display:inline-grid;place-items:center;width:55px;height:55px;border:2px solid #8f382f;color:#8f382f;transform:rotate(-4deg);font-size:13px;letter-spacing:.12em}.ending h1{font-size:32px;margin:20px 0 8px}.ending h2{font-size:14px;font-weight:400;color:#786545;letter-spacing:.25em}.ending p{line-height:1.9;text-align:left}.ending-block{text-align:left;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.ending-actions{display:grid;gap:9px;margin-top:22px}
    textarea.save-text{width:100%;height:170px;border:1px solid #a8936c;background:#faf2dc;border-radius:8px;padding:10px;font-size:11px;word-break:break-all}
    .progress-line{height:8px;background:#d3c3a0;border-radius:8px;overflow:hidden}.progress-line i{display:block;height:100%;background:#8b6332}
    .kbd{font-family:monospace;background:#d8c9a9;padding:1px 4px;border-radius:3px}
    @media (min-width:600px){.landing{padding-inline:46px}.scene,.choices{padding-left:30px;padding-right:30px}.creator{padding-inline:34px}.choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.panel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  </style>
</head>
<body class="paper-noise">
<main class="app" id="app">
  <section class="screen landing" id="landing">
    <div class="seal">非官方同人作品</div>
    <h1 class="brand">汴河<br>夜雨</h1>
    <div class="brand-sub">北宋幻想 · 文字武侠 MUD</div>
    <p class="pitch">一枚失落多年的“照夜璧”，牵动汴京、边关与半座江湖。你留下的每一句话、每一次拔刀，都会在后来得到回应。</p>
    <div class="disclaimer">本作为非商业、非官方同人互动作品。仅借鉴北宋武侠江湖题材的氛围与玩法结构；角色、剧情、地名及全部文本均为原创，不含官方美术、音乐或剧情素材。</div>
    <div class="landing-actions">
      <button class="btn primary" id="newGameBtn">落笔入江湖</button>
      <button class="btn ghost hidden" id="continueBtn">续写前尘</button>
      <button class="btn ghost" data-open="archive">江湖图鉴</button>
    </div>
    <div class="continue-note">无需登录 · 自动存档 · 可离线游玩</div>
  </section>

  <section class="screen creator hidden" id="creator">
    <div class="creator-head">
      <button class="btn small" id="creatorBack">返回</button>
      <h2 id="creatorTitle">写下名姓</h2>
      <span class="step-mark" id="stepMark">一 / 三</span>
    </div>
    <div id="creatorStep1" class="form-grid">
      <label class="field">角色姓名<input id="charName" maxlength="8" placeholder="如：沈砚秋"></label>
      <label class="field">性别或自定义身份<select id="charGender"><option>女</option><option>男</option><option>自定义</option></select></label>
      <label class="field hidden" id="customGenderWrap">如何称呼<input id="charCustomGender" maxlength="12" placeholder="写下你的身份"></label>
      <label class="field">外貌特征<input id="charLook" maxlength="24" placeholder="如：眉目疏淡，左腕系红绳"></label>
      <label class="field">江湖称号<input id="charTitle" maxlength="12" placeholder="如：听雨客"></label>
    </div>
    <div id="creatorStep2" class="hidden">
      <p>出身决定初始资源、关系与专属见闻，但不会锁死你的道路。</p>
      <div class="choice-grid" id="originChoices"></div>
    </div>
    <div id="creatorStep3" class="hidden">
      <p>十一脉武学皆可通往巅峰。每一流派拥有独立招式、天赋与核心机制。</p>
      <div class="choice-grid school-grid" id="schoolChoices"></div>
    </div>
    <div class="creator-actions">
      <button class="btn" id="creatorPrev">上一步</button>
      <button class="btn primary" id="creatorNext">下一步</button>
    </div>
  </section>

  <section class="screen game hidden" id="game">
    <header class="statusbar">
      <div class="status-top">
        <div class="avatar" id="avatar">侠</div>
        <div class="who"><b id="statusName">无名客</b><small id="statusRealm">Lv.1 · 初窥门径</small></div>
        <div class="place" id="statusPlace">汴河埠头</div>
      </div>
      <div class="bars">
        <div class="bar hp"><i id="hpBar"></i></div><div class="bar mp"><i id="mpBar"></i></div>
      </div>
      <div class="bar-labels"><span id="hpLabel">气血</span><span id="mpLabel">内力</span></div>
    </header>
    <div id="sceneArea">
      <section class="scene">
        <div class="chapter-kicker" id="chapterKicker">序章</div>
        <h1 id="sceneTitle">汴河夜雨</h1>
        <div class="story-text" id="storyText"></div>
        <div class="delta-log" id="deltaLog"></div>
      </section>
      <section class="choices" id="choices"></section>
    </div>
    <div id="battleArea" class="hidden"></div>
    <nav class="bottom-nav" aria-label="游戏功能">
      <button class="nav-btn" data-open="character"><i>侠</i>角色</button>
      <button class="nav-btn" data-open="inventory"><i>囊</i>背包</button>
      <button class="nav-btn" data-open="equipment"><i>甲</i>装备</button>
      <button class="nav-btn" data-open="skills"><i>武</i>武学</button>
      <button class="nav-btn" data-open="quests"><i>卷</i>任务</button>
      <button class="nav-btn" data-open="relations"><i>缘</i>关系</button>
      <button class="nav-btn" data-open="fort"><i>庐</i>福地</button>
      <button class="nav-btn" data-open="achievements"><i>印</i>成就</button>
      <button class="nav-btn" data-open="settings"><i>设</i>设置</button>
    </nav>
  </section>
</main>
<div class="modal-wrap hidden" id="modalWrap" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">卷宗</h2><button class="close" id="modalClose" aria-label="关闭">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast-stack" id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";
const SAVE_KEY="bianheNight.auto.v1", META_KEY="bianheNight.meta.v1", SLOT_PREFIX="bianheNight.slot.";
const VERSION=1, REALMS=["初窥门径","略有小成","融会贯通","炉火纯青","登峰造极","返璞归真","天人合一"];
const SLOTS=["武器","头部","上衣","护腕","腰带","鞋履","项链","戒指","护符"];
const QUALITIES=["凡品","良品","上品","珍品","绝品","百炼","神兵"];
const STATUS_NAMES={poison:"中毒",bleed:"流血",stun:"眩晕",root:"定身",armorBreak:"破甲",weak:"虚弱",burn:"灼烧",cold:"寒冷",shield:"护盾",regen:"回春",hidden:"隐匿",berserk:"狂暴"};
const ORIGINS={

  p1_fail:{chapter:"序章 · 初入江湖",place:"汴河埠头",title:"试探落空",text:"你只说对了一半。领头人短促一笑，刀背撞上你的肩。木匣在混乱中磕出一道缝，里面没有珠宝，只有一角烧焦的星图。",onEnter:{stats:{hp:-12},world:{sawMap:true}},options:[
    {label:"忍痛迎战",action:"battle",enemy:"dockThugs",next:"p2",className:"combat"},
    {label:"护住星图，带少年跳入货船",next:"p2",effects:{personality:{freedom:2},relation:{linQue:{favor:2,trust:1}}}}
  ]},
  p2:{chapter:"序章 · 初入江湖",place:"州桥夜市",title:"半枚铜铃",text:"追兵退去后，少年自称林鹊。他掰开木匣，露出烧焦星图与半枚铜铃：“我爹死前只说，去州桥找一个肯先救人、再问价的人。”\n\n远处巡夜梆子响了三更。你不知道自己是否合他口中的标准，但这桩事已经认得你的名字。",onEnter:{achievement:"prologue",quest:{id:"main",name:"照夜旧案",stage:"去州桥追查木匣来历"},stats:{xp:50,cultivation:30},items:{smallPill:2,page:1}},options:[
    {label:"与林鹊同去州桥",next:"c1_0",effects:{relation:{linQue:{favor:2,trust:2}}}},
    {label:"先把木匣交给大理寺",next:"c1_0",effects:{personality:{scheme:1},relation:{guLin:{favor:2,trust:1}},world:{informedYamen:true}}},
    {label:"暂时分开，约在晨市见",next:"c1_0",effects:{personality:{freedom:2},relation:{linQue:{favor:-1,trust:1}}}}
  ]},
  c1_0:{chapter:"第一章 · 汴京迷局",place:"州桥夜市",title:"灯市无灯",text:"州桥仍有酒气与炊烟，唯独售灯的“陆三娘”摊位一片漆黑。摊后的茶盏尚温，地上却散着三样不相干的东西：半张漕运票、一根鸦羽、以及沾了药味的红线。\n\n顾临川带着大理寺差役赶到，第一句话便是：“从现在起，谁也别碰。”",options:[
    {label:"查看漕运票的水印",next:"c1_1",effects:{world:{clueTicket:true},relation:{guLin:{trust:2}}}},
    {label:"嗅辨红线上的药味",next:"c1_1",effects:{world:{clueMedicine:true},relation:{wenJiu:{trust:1}}}},
    {label:"问邻摊小贩昨夜所见",next:"c1_1",effects:{world:{clueWitness:true},stats:{reputation:1}}},
    {label:"认出旧官署的裁票手法",next:"c1_1",condition:{origin:"noble"},hidden:true,effects:{world:{clueOfficial:true},stats:{insight:2}}}
  ]},
  c1_1:{chapter:"第一章 · 汴京迷局",place:"州桥夜市",title:"各取所需",text:"线索都指向城西废弃的丰乐仓。顾临川想依法封仓，林鹊担心陆三娘活不到天亮；四海栈少主苏砚舟则送来口信，说仓库今晚会转运一批“不能见光的旧货”。\n\n三条路都讲得通，代价各不相同。",options:[
    {label:"随顾临川申请封仓公文",next:"c1_2",effects:{personality:{scheme:1},relation:{guLin:{favor:2,trust:3}},world:{routeLaw:true}}},
    {label:"与林鹊翻墙先救人",next:"c1_2",check:{stat:"agility",min:12,success:"c1_2",failure:"c1_wallFail"},effects:{personality:{benevolence:1,freedom:1},world:{routeRescue:true}}},
    {label:"搭苏砚舟的货车混入",next:"c1_2",effects:{personality:{scheme:2},relation:{suYuan:{favor:2,trust:2}},world:{routeTrade:true}}},
    {label:"用飞索越过仓墙",next:"c1_2",condition:{item:"rope"},hidden:true,effects:{world:{routeRope:true},stats:{agility:1}}}
  ]},
  c1_wallFail:{chapter:"第一章 · 汴京迷局",place:"丰乐仓外",title:"墙头碎瓦",text:"旧墙比想象中更脆。你踏落半片青瓦，惊动巡哨，还在掌心划开一道口子。好在林鹊故意把人引向另一边，你们仍从排水沟钻进仓内，只是失了先手。",onEnter:{stats:{hp:-16},relation:{linQue:{favor:1,trust:2}},world:{alarm:true}},options:[{label:"沿排水沟继续前行",next:"c1_2"}]},
  c1_2:{chapter:"第一章 · 汴京迷局",place:"丰乐仓",title:"鸦纹账页",text:"丰乐仓里没有陆三娘，只有一桌还没烧完的账。账页记着十七年前一批“照夜石”从边关转入汴京，押运人名全被挖去。\n\n屋脊传来瓦响。鸦纹刺客抛下火折，转身便走。火势与追凶，只能先顾一头。",options:[
    {label:"扑灭账页上的火",next:"c1_3",effects:{personality:{scheme:1},world:{savedLedger:true},relation:{guLin:{trust:3}}}},
    {label:"追上屋脊，不让刺客离开",next:"c1_3",effects:{personality:{obsession:2},world:{chasedAssassin:true},stats:{agility:1}}},
    {label:"先破开内室救人",next:"c1_3",effects:{personality:{benevolence:2},world:{savedLu:true},stats:{chivalry:3},relation:{linQue:{trust:2}}}},
    {label:"以弦音震落火折并锁住退路",next:"c1_3",condition:{school:"shenxiang"},hidden:true,effects:{world:{savedLedger:true,savedLu:true},stats:{reputation:2}}}
  ]},
  c1_3:{chapter:"第一章 · 汴京迷局",place:"丰乐仓屋脊",title:"乌瓦惊鸦",text:"刺客终于在仓脊尽头停下。他摘下面巾，竟是皇城司失踪多年的校尉周奎。“你们查的不是宝，是一份会让许多忠臣变成罪人的名单。”\n\n他左肋微微僵硬，袖中却已亮出第二把刀。",options:[
    {label:"逼他交出账页",action:"battle",enemy:"crowAssassin",next:"c1_after",className:"combat"},
    {label:"说出你查到的青灰与官印",action:"battle",enemy:"crowAssassin",next:"c1_after",effects:{world:{bossEvidence:true}},className:"combat"},
    {label:"许诺保全名单上仍活着的人",action:"battle",enemy:"crowAssassin",next:"c1_after",effects:{world:{bossMercy:true},personality:{benevolence:2}},className:"combat"}
  ]},
  c1_after:{chapter:"第一章 · 汴京迷局",place:"栖霞旧宅",title:"一处可归之地",text:"周奎留下的残页把线索指向雁门旧垒。陆三娘若获救，便把城外栖霞岭的一座旧宅交给你看守；若她未能生还，顾临川也会把这处查封产业暂借给你。\n\n院里有荒药圃、断炉和一间上锁的地下室。林鹊把木匣搁在桌上：“至少以后逃命，有地方吃碗热饭。”",onEnter:{achievement:"chapter1",unlockFort:true,stats:{xp:180,cultivation:110,level:3,wealth:80},equipment:"eq_0_2",items:{herb:3,iron:3,page:2},quest:{id:"main",name:"照夜旧案",stage:"北上雁门，重查弃城令"}},options:[
    {label:"修整一夜，启程北上",next:"c2_0"},
    {label:"先查看新解锁的福地",action:"open",panel:"fort",next:"c2_0"},
    {label:"向流派师长请教鸦纹刀势",next:"c2_0",effects:{relation:{muHanshan:{favor:2,trust:2}},stats:{cultivation:25}}}
  ]},
  c2_0:{chapter:"第二章 · 边关旧案",place:"雁门雪道",title:"旧垒无名碑",text:"雁门风像钝刀。萧砚真在旧垒外等你，脚边立着三百块没有名字的木牌。她说当年并非战败，而是有人故意晚送一道军令，好让押运照夜石的队伍从乱军中消失。\n\n负责执行弃城令的程烈仍守在废垒，从未为自己辩解。",options:[
    {label:"先守住今夜来袭的马匪",next:"c2_1",effects:{world:{borderRoute:"defend"},personality:{benevolence:1},relation:{xiaoYanzhen:{favor:3,trust:2}}}},
    {label:"潜入军库寻找原始军令",next:"c2_1",effects:{world:{borderRoute:"infiltrate"},personality:{scheme:2},stats:{insight:1}}},
    {label:"阵前质问程烈",next:"c2_1",effects:{world:{borderRoute:"duel"},personality:{obsession:1},stats:{reputation:2}}},
    {label:"用雁翎旧箭核对督造印",next:"c2_1",condition:{origin:"soldier"},hidden:true,effects:{world:{borderProof:true},relation:{xiaoYanzhen:{trust:3}}}}
  ]},
  c2_1:{chapter:"第二章 · 边关旧案",place:"雁门旧垒",title:"弃城令",text:"你找到的军令有两层墨：上层命程烈弃城，下层却是让他死守三日。改令者来自汴京，印章属于已经“病逝”的太常少卿。\n\n程烈提枪走下城头。他承认执行了上层命令，却说那让三百军士换得两千百姓出关。",options:[
    {label:"以武逼他交出押运名册",action:"battle",enemy:"borderCommander",next:"c2_after",className:"combat"},
    {label:"公开两层墨的证据",action:"battle",enemy:"borderCommander",next:"c2_after",effects:{world:{borderEvidence:true}},className:"combat"},
    {label:"先问那两千百姓如今何在",action:"battle",enemy:"borderCommander",next:"c2_after",effects:{world:{askedSurvivors:true},personality:{benevolence:2}},className:"combat"}
  ]},
  c2_after:{chapter:"第二章 · 边关旧案",place:"雁门关",title:"烽火有名",text:"押运名册最后一页写着：照夜石并非宝石，而是一座能记录并放大人心执念的古代机枢。残件已被送往镜湖与天机秘府。\n\n萧砚真要把三百人的名字刻回碑上；朝廷使者却催你立即封存证据。",onEnter:{stats:{xp:260,cultivation:160,level:4},items:{page:2,oldArrow:1},relation:{xiaoYanzhen:{favor:2,trust:2}},quest:{id:"main",name:"照夜旧案",stage:"循水路追查镜湖沉船"}},options:[
    {label:"帮萧砚真重刻名碑",next:"c3_0",effects:{stats:{chivalry:4,reputation:3},world:{namedFallen:true}}},
    {label:"把原件交顾临川封存",next:"c3_0",effects:{relation:{guLin:{trust:4}},personality:{scheme:2},world:{sealedOrder:true}}},
    {label:"复制两份，分别交给军民",next:"c3_0",effects:{personality:{scheme:1,freedom:1},world:{spreadOrder:true},stats:{notoriety:2,reputation:2}}}
  ]},
  c3_0:{chapter:"第三章 · 秘宝之争",place:"镜湖渡口",title:"沉船与旧友",text:"镜湖水寨、四海栈和皇城司都在打捞同一艘沉船。唐云栖见到水寨旗号时脸色发白：她曾是寨中二当家，也是唯一知道沉船暗舱入口的人。\n\n她愿带路，但要求你保证，不把水寨老弱交给官府邀功。",options:[
    {label:"答应她，罪证只追首恶",next:"c3_1",effects:{relation:{tangYun:{favor:4,trust:4}},personality:{benevolence:1},world:{protectWaterfolk:true}}},
    {label:"只承诺依法核实每个人",next:"c3_1",effects:{relation:{guLin:{trust:2},tangYun:{favor:-1,trust:1}},world:{lawWaterfolk:true}}},
    {label:"不做承诺，但让她共同保管证据",next:"c3_1",effects:{relation:{tangYun:{trust:3}},personality:{freedom:1},world:{sharedEvidence:true}}},
    {label:"出示水路商券，先买下沉船打捞权",next:"c3_1",condition:{origin:"merchant"},hidden:true,effects:{stats:{wealth:-80},relation:{suYuan:{trust:3}},world:{boughtWreck:true}}}
  ]},
  c3_1:{chapter:"第三章 · 秘宝之争",place:"镜湖沉船",title:"水下星舱",text:"暗舱里不是金银，而是一枚会随呼吸明灭的黑色玉片。它映出你一路做过的选择：被放走的人、没来得及救的人、交出的证据与藏下的谎。\n\n魏无明隔着水幕开口：“你看，天下并不需要真相，只需要一个足够强的人替他们选择。”",options:[
    {label:"带走玉片，但拒绝让它读取记忆",next:"c3_2",effects:{items:{mirrorShard:1},personality:{freedom:2},world:{resistedShard:true}}},
    {label:"让玉片显出十七年前最后一幕",next:"c3_2",effects:{items:{mirrorShard:1,starMap:1},personality:{obsession:2},world:{sawOldTruth:true}}},
    {label:"当场击碎玉片",next:"c3_2",effects:{stats:{chivalry:2},world:{brokeShard:true},relation:{weiWuming:{favor:-3,trust:1}}}},
    {label:"以潮光踏入倒影",next:"c3_2",condition:{school:"chaoguang"},hidden:true,effects:{world:{mirrorPath:true,sawOldTruth:true},stats:{insight:3}}}
  ]},
  c3_2:{chapter:"第三章 · 秘宝之争",place:"镜湖水寨",title:"三方夜谈",text:"出水后，顾临川要证据，苏砚舟要货单，唐云栖要乡亲平安。三人的要求彼此冲突，却都不是恶意。\n\n你只有一份沉船名册。交给谁，谁就掌握下一步主动。",options:[
    {label:"交顾临川，换取合法搜查天机秘府",next:"c3_after",effects:{relation:{guLin:{favor:3,trust:4},suYuan:{trust:-2}},world:{faction:"court"}}},
    {label:"交苏砚舟，切断照骨楼的银钱",next:"c3_after",effects:{relation:{suYuan:{favor:3,trust:4},guLin:{trust:-2}},world:{faction:"merchant"}}},
    {label:"交唐云栖，让水寨自证清白",next:"c3_after",effects:{relation:{tangYun:{favor:4,trust:4}},world:{faction:"folk"}}},
    {label:"记下内容后烧掉名册",next:"c3_after",effects:{personality:{scheme:2,freedom:1},world:{faction:"self",burnedManifest:true}}}
  ]},
  c3_after:{chapter:"第三章 · 秘宝之争",place:"栖霞福地",title:"照夜来信",text:"福地地下室的锁在玉片靠近时自行打开。里面只有一封鹤照隐留下的旧信：照夜璧若重组，会把持有者最深的执念扩散给周围所有人。\n\n真正的秘宝不是力量，而是让一座城相信“只有一个答案”。",onEnter:{stats:{xp:300,cultivation:210,level:5},items:{page:3,timber:3},world:{fortSecret:true},quest:{id:"main",name:"照夜旧案",stage:"进入天机秘府，阻止照夜璧重组"}},options:[
    {label:"召集仍信任你的伙伴",next:"c4_0",effects:{world:{calledAllies:true}}},
    {label:"只身前往，免得牵连旁人",next:"c4_0",effects:{personality:{freedom:2},world:{wentAlone:true}}},
    {label:"先研读《息兵问心篇》",next:"c4_0",condition:{item:"hiddenManual"},hidden:true,effects:{world:{peaceMind:true},stats:{insight:2,cultivation:40}}}
  ]},
  c4_0:{chapter:"第四章 · 天下抉择",place:"天机秘府",title:"万门轮转",text:"天机秘府像一架埋在山腹里的巨大钟表。魏无明已将三枚玉片嵌入机枢，只缺林鹊体内那半幅星图。\n\n林鹊被困在中央光幕里，却冲你喊：“别先救我！先停轮轴，否则整座汴京都会听见他的念头。”",onEnter:{stats:{xp:250,cultivation:140,level:5},items:{bigPill:2,spiritTea:2}},options:[
    {label:"先停轮轴，再救林鹊",next:"c4_1",effects:{personality:{scheme:1},world:{stoppedMachine:true},relation:{linQue:{favor:-1,trust:3}}}},
    {label:"先破光幕救人",next:"c4_1",effects:{personality:{benevolence:2},world:{savedLinFirst:true},relation:{linQue:{favor:4,trust:2}}}},
    {label:"让伙伴分头行动",next:"c4_1",condition:{relationTrust:18},hidden:true,effects:{world:{stoppedMachine:true,savedLinFirst:true,alliesWorked:true}}},
    {label:"前世里我已见过这道轮轴",next:"c4_1",condition:{ngPlus:true},hidden:true,effects:{world:{memoryAwake:true,stoppedMachine:true},achievement:"oldDream"}}
  ]},
  c4_1:{chapter:"第四章 · 天下抉择",place:"天机秘府",title:"照骨之问",text:"魏无明没有立刻出手。他让照夜璧映出旧案真相：十七年前，朝堂与武林共同牺牲一支押运队，阻止秘宝落入外敌；幸存者则被灭口，以维持所谓大局。\n\n“若公开真相，天下会乱；若埋葬真相，亡者永无姓名。你凭什么替他们选？”",options:[
    {label:"我不替天下选，我只让天下知道代价",next:"c4_boss",effects:{personality:{benevolence:1,freedom:2},world:{truthChoice:"public",fullTruth:true},achievement:"truth"}},
    {label:"秩序不能靠谎言，但揭露需要时机",next:"c4_boss",effects:{personality:{scheme:2},world:{truthChoice:"controlled",fullTruth:true}}},
    {label:"死者需要公道，活人也需要明天",next:"c4_boss",effects:{personality:{benevolence:2},world:{truthChoice:"reconcile",fullTruth:true}}},
    {label:"这一次，我拒绝照前世给出的答案",next:"c4_boss",condition:{ngPlus:true},hidden:true,effects:{world:{truthChoice:"break",memoryAwake:true,fullTruth:true}}}
  ]},
  c4_boss:{chapter:"第四章 · 天下抉择",place:"照夜机枢",title:"谁执长夜",text:"照夜光起，所有人的执念都被放大。魏无明身后浮出无数旧案亡者的影子，机枢开始把他的意志送向汴京。\n\n神兵、证词、关系与一路选择，都将在这一战中回应你。",options:[
    {label:"踏入光中，阻止魏无明",action:"battle",enemy:"weiWuming",next:"c5_0",className:"combat"},
    {label:"呼唤仍愿信任你的人",action:"battle",enemy:"weiWuming",next:"c5_0",effects:{world:{allyCall:true}},className:"combat"},
    {label:"以《息兵问心篇》回应他的执念",action:"battle",enemy:"weiWuming",next:"c5_0",condition:{item:"hiddenManual"},hidden:true,effects:{world:{bossPeace:true}},className:"combat"}
  ]},
  c5_0:{chapter:"第五章 · 余波",place:"照夜机枢",title:"天将破晓",text:"机枢停了。照夜璧落在你手中，温热得像一颗仍在犹豫的心。顾临川、萧砚真、苏砚舟与林鹊各站在不同方向，没人催促你。\n\n江湖真正记住的，从来不只是你击败了谁，而是最后把选择交给了什么。",onEnter:{stats:{xp:500,cultivation:300,level:3},quest:{id:"main",name:"照夜旧案",stage:"已到终局"}},options:[
    {label:"公开真相，把照夜璧交给共同见证",action:"ending",direction:"public"},
    {label:"封印照夜璧，成为守灯人",action:"ending",direction:"seal"},
    {label:"掌握照夜璧，以力量终结争夺",action:"ending",direction:"power"},
    {label:"毁掉记录，带幸存者离开",action:"ending",direction:"leave"},
    {label:"借商路分散秘宝残件",action:"ending",direction:"trade",condition:{wealth:700},hidden:true},
    {label:"拆毁制造“唯一答案”的机枢",action:"ending",direction:"break",condition:{ngPlus:true},hidden:true}
  ]}
};

function calcDamage(power=1,ignore=0){
  const b=state.battle,t=totalStats(),s=state.player.stats,e=b.enemy;

  let def=e.defense*(hasStatus(b.enemyStatuses,"armorBreak") ? .65 : 1);

function useSkill(sk){

function enemyTurn(){
  const b=state.battle;if(!b||b.enemy.hp<=0||b.ended)return;
  if(hasStatus(b.enemyStatuses,"stun")){b.log.push(`${b.enemy.name}眩晕未醒，行动中断。`);return}
  const e=b.enemy,s=state.player.stats,t=totalStats();let atk=e.attack*(hasStatus(b.enemyStatuses,"weak") ? .72 : 1)*(hasStatus(b.enemyStatuses,"berserk")?1.28:1);
  let def=t.defense*(hasStatus(b.playerStatuses,"armorBreak") ? .65 : 1);let dmg=Math.max(2,Math.round(atk-def*.55+rand(-4,5)));
  if(b.defending)dmg=Math.round(dmg*.55);
  if(hasStatus(b.playerStatuses,"hidden")&&chance(.45)){b.log.push("你借隐匿避开了这一击。");return}
  if(hasStatus(b.playerStatuses,"shield")){const sh=b.playerStatuses.shield,take=Math.min(sh.power,dmg);sh.power-=take;dmg-=take;b.log.push(`护盾抵消 ${take} 点伤害。`);if(sh.power<=0)delete b.playerStatuses.shield}
  const move=e.moves[(b.turn-1)%e.moves.length];s.hp-=dmg;b.log.push(`${e.name}施展${move}，造成 <b>${dmg}</b> 点伤害。`);
  if(b.turn%3===0){const statuses=["bleed","poison","cold","armorBreak","weak"];const st=statuses[(b.turn+e.level)%statuses.length];addStatus(b.playerStatuses,st,2,Math.max(4,Math.floor(e.attack*.16)));b.log.push(`你陷入${STATUS_NAMES[st]}。`)}
}
function tickStatuses(obj,isPlayer){
  Object.entries(obj).forEach(([k,v])=>{
    if(["poison","bleed","burn"].includes(k)){const dmg=Math.max(3,v.power||5);if(isPlayer){state.player.stats.hp-=dmg;state.battle.log.push(`${STATUS_NAMES[k]}造成 ${dmg} 点伤害。`)}else{state.battle.enemy.hp-=dmg;state.battle.log.push(`${state.battle.enemy.name}受${STATUS_NAMES[k]} ${dmg} 点伤害。`)}}
    if(k==="regen"&&isPlayer)healPlayer(v.power||7,"回春");
    v.turns--;if(v.turns<=0)delete obj[k];
  })

function resolveEnding(direction){

  else if(direction==="seal"){if(state.fort.level>=3||hasItem("mirrorShard"))id="guardian";else id="buried"}
  else if(direction==="leave"){if(Object.values(r).some(x=>x.trust>=45)&&state.fort.unlocked)id="hermit";else id="wander"}
  else if(direction==="trade")id="tycoon";
  else if(direction==="public"){if(r.xiaoYanzhen.trust>=35&&w.namedFallen)id="general";else if(state.player.realm>=5)id="master";else if(p.scheme>p.benevolence+4&&w.faction==="court")id="court";else id="hero"}
  else id="hero";
  const hasQuestionNight=Object.values(state.gear).some(x=>x?.id==="eq_0_6")||state.inventory.equipment.some(x=>x.id==="eq_0_6");
  if(hasQuestionNight){
    const will=p.benevolence+p.freedom-p.obsession-s.notoriety;
    state.world.weaponWill=will;
    if(direction==="power"&&will<0){unlockAchievement("brokenBlade");id="betrayed"}

  }
  endGame(id);
}

function realmNeed(){const r=state.player.realm+1;return{level:Math.min(28,r*4),cultivation:r*180,pages:r+1,insight:7+r*2}}
function openBreakthrough(){
  if(state.player.realm>=6){toast("已至天人合一。");return}
  const n=realmNeed(),s=totalStats(),missing=[];if(state.player.level<n.level)missing.push(`等级 ${n.level}`);if(state.player.stats.cultivation<n.cultivation)missing.push(`修为 ${n.cultivation}`);if(getItemCount("page")<n.pages)missing.push(`残页 ${n.pages}`);if(s.insight<n.insight)missing.push(`悟性 ${n.insight}`);
  if(missing.length){toast(`尚缺：${missing.join("、")}`,"bad");return}
  showModal("心境试炼",`<p>雨声忽远。你看见一路上所有未能两全的选择。门槛不问你赢过多少人，只问你愿意承认什么。</p><div class="list">

  <button class="choice-btn" data-break="obsess">记住每一笔债，直到无人能逃过清算</button></div>`);
  document.querySelectorAll("[data-break]").forEach(b=>b.onclick=()=>doBreakthrough(b.dataset.break,n));

function doBreakthrough(choice,n){
  const map={accept:"benevolence",control:"scheme",release:"freedom",obsess:"obsession"},key=map[choice],p=state.personality;
  state.player.stats.cultivation-=n.cultivation;addItem("page",-n.pages);p[key]+=3;
  const score=totalStats().insight+state.player.stats.luck+Math.max(0,p[key])+rand(0,18);let result;
  if(score>=n.insight+26){result="perfect";state.player.realm++;state.player.stats.attack+=4;state.player.stats.defense+=3;state.player.stats.hpMax+=18;addItem("hiddenManual",1);unlockAchievement("perfectRealm")}
  else if(score>=n.insight+10){result="normal";state.player.realm++;state.player.stats.attack+=3;state.player.stats.defense+=2;state.player.stats.hpMax+=12}
  else if(choice==="obsess"&&chance(.5)){result="demon";state.player.realm++;state.player.permanentWound++;state.player.stats.hpMax-=10;state.player.stats.attack+=6;state.player.stats.notoriety+=3;unlockAchievement("demonRealm")}
  else{result="fail";state.player.stats.hp=Math.max(1,state.player.stats.hp-35);state.player.stats.cultivation+=Math.floor(n.cultivation*.45)}
  if(result!=="fail")unlockAchievement("realmUp");
  const text={perfect:"心湖澄明，你不仅越过门槛，还领悟了隐藏心法《息兵问心篇》。",normal:"气机贯通，你稳稳踏入新的境界。",demon:"心火吞没一瞬清明。你强行破境，却留下永久暗伤。",fail:"最后一步气息散乱。你保住性命，也保留了部分修为与教训。"}[result];
  closeModal();toast(text,result==="fail"||result==="demon"?"bad":"good");state.player.stats.hp=Math.min(totalStats().hpMax,Math.max(1,state.player.stats.hp+30));autoSave();render();
}

  if(type==="train"){s.energy-=20;s.cultivation+=35+f.level*5;toast("演武结束，修为有所精进。","good")}
  if(type==="mail"){s.energy-=8;const a=ADVENTURES.find(x=>!state.adventures.includes(x.id));if(a){state.adventures.push(a.id);addHistory(`奇遇「${a.name}」：${a.desc}`);toast(`触发奇遇 · ${a.name}`,"good")}else toast("今日只有一封故友问安。")}
  if(type==="dispatch"){const ally=Object.entries(state.relations).filter(([,r])=>r.trust>=15).sort((a,b)=>b[1].trust-a[1].trust)[0];if(!ally){toast("还没有足够信任你的伙伴。","bad");return}s.energy-=10;f.dispatches++;addItem(chance(.5)?"iron":"herb",2);state.relations[ally[0]].favor+=1;toast(`${NPCS[ally[0]].name} 带回了资源。`,"good")}
  if(type==="guest"){openGuestPicker();return}
  if(hasItem("beastEgg")){f.beastCare++;if(f.beastCare>=5&&!state.world.beastBorn){state.world.beastBorn=true;state.adventures.push("adv_beast");toast("灵兽“墨团”破壳而出，成为福地伙伴！","good")}}
  checkAchievements();autoSave();renderFort()
}
function openGuestPicker(){
  const known=Object.entries(state.relations).filter(([,r])=>r.status==="已相识");
  if(!known.length){toast("尚无可以邀请的相识之人。","bad");return}
  showModal("邀请做客",`<div class="list">${known.map(([id,r])=>`<button class="choice-btn" data-guest="${id}">${esc(NPCS[id].name)}<small>${relationLabel(r)} · ${NPCS[id].stance}</small></button>`).join("")}</div>`);
  document.querySelectorAll("[data-guest]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.guest,r=state.relations[id];state.fort.visitors=Array.from(new Set([...state.fort.visitors,id]));r.favor+=2;
    if((r.stance==="朝堂"||r.stance==="照骨楼")&&hasItem("mirrorShard")&&r.trust<15){state.world.fortLeak=true;r.trust-=2;toast(`${NPCS[id].name}似乎留意到了地下室的异光。情报可能已经外泄。`,"bad")}
    else{r.trust+=1;toast(`${NPCS[id].name}在院中留到灯尽。`,"good")}
    closeModal();autoSave();render()
  });
}
function upgradeFort(){
  const f=state.fort,cost=100+f.level*70;if(f.level>=7){toast("福地已升至最高等级。");return}if(state.player.stats.wealth<cost||getItemCount("timber")<2){toast(`需要 ${cost} 财富与沉香木 ×2。`,"bad");return}
  state.player.stats.wealth-=cost;addItem("timber",-2);f.level++;const rooms=["药圃","锻造台","藏书阁","演武场","客舍","灵兽园","地下密室"];f.rooms=rooms.slice(0,f.level);if(f.level===3)state.inventory.capacity+=8;if(f.level===5)state.inventory.capacity+=8;checkAchievements();autoSave();renderFort()
}
function renderAchievements(tab="全部"){
  const cats=["全部","剧情","战斗","探索","收集","关系","隐藏","特殊失败"];
  const list=ACHIEVEMENTS.filter(a=>tab==="全部"||a.category===tab);
  showModal(`成就 · ${state.achievements.length}/${ACHIEVEMENTS.length}`,`<div class="tabs">${cats.map(x=>`<button class="tab ${x===tab?"active":""}" data-atab="${x}">${x}</button>`).join("")}</div><div class="list">${list.map(a=>{const got=state.achievements.includes(a.id)||meta.achievements.includes(a.id);return`<div class="list-card"><h3>${got?"◆":"◇"} ${esc(a.hidden&&!got?"未解之印":a.name)}</h3><p>${esc(a.hidden&&!got?"条件隐于前尘，或许另一个周目会留下线索。":a.desc)}</p><span class="tag">${a.category}</span></div>`}).join("")}</div>`);
  document.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>renderAchievements(b.dataset.atab))
}
function renderSettings(){
  showModal("设置与存档",`<div class="list">
  <div class="list-card"><h3>阅读设置</h3><label class="field">字号 <input id="fontRange" type="range" min="14" max="21" value="${state.settings.font}"></label><label><input id="motionToggle" type="checkbox" ${state.settings.reduceMotion?"checked":""}> 减少动态效果</label><br><label><input id="soundToggle" type="checkbox" ${state.settings.sound?"checked":""}> 开启轻提示音</label><br><label><input id="randomToggle" type="checkbox" ${state.settings.randomEncounters?"checked":""}> 开启随机战斗</label></div>
  <div class="list-card"><h3>存档</h3><div class="card-actions"><button class="btn small" data-save-slot="1">保存一</button><button class="btn small" data-load-slot="1">读取一</button><button class="btn small" data-save-slot="2">保存二</button><button class="btn small" data-load-slot="2">读取二</button><button class="btn small" data-save-slot="3">保存三</button><button class="btn small" data-load-slot="3">读取三</button></div><p>自动存档会在每次重要选择、战斗与物品变化后更新。</p></div>
  <div class="list-card"><h3>分享与迁移</h3><div class="card-actions"><button class="btn small" id="exportSave">导出存档文本</button><button class="btn small" id="importSave">导入存档文本</button><button class="btn small" id="copySummary">复制当前冒险摘要</button></div></div>
  <div class="list-card"><button class="btn danger" id="restartGame">重新开始本周目</button></div></div>`);
  document.getElementById("fontRange").oninput=e=>{state.settings.font=Number(e.target.value);applySettings();autoSave()};
  document.getElementById("motionToggle").onchange=e=>{state.settings.reduceMotion=e.target.checked;applySettings();autoSave()};
  document.getElementById("soundToggle").onchange=e=>{state.settings.sound=e.target.checked;autoSave()};
  document.getElementById("randomToggle").onchange=e=>{state.settings.randomEncounters=e.target.checked;autoSave()};
  document.querySelectorAll("[data-save-slot]").forEach(b=>b.onclick=()=>manualSave(b.dataset.saveSlot));
  document.querySelectorAll("[data-load-slot]").forEach(b=>b.onclick=()=>manualLoad(b.dataset.loadSlot));
  document.getElementById("exportSave").onclick=exportSave;document.getElementById("importSave").onclick=importSave;document.getElementById("copySummary").onclick=copySummary;
  document.getElementById("restartGame").onclick=()=>{if(confirm("确定放弃当前周目并重新创建角色？已解锁成就与结局会保留。"))showCreator(true)};
}
function openArchive(){
  const ends=Object.entries(ENDINGS);showModal("江湖图鉴",`<p>已解锁结局 ${meta.endings.length}/${ends.length} · 成就 ${meta.achievements.length}/${ACHIEVEMENTS.length} · 完成周目 ${meta.runs}</p><h3 class="section-title">结局图鉴</h3><div class="list">${ends.map(([id,e])=>{const got=meta.endings.includes(id);return`<div class="list-card"><h3>${got?esc(e.name):"未题名的结局"}</h3><p>${got?esc(e.desc):esc(e.hint)}</p></div>`}).join("")}</div>`)
}
function applySettings(){
  const st=state?.settings||{font:16,reduceMotion:false};document.documentElement.style.setProperty("--fs",`${st.font}px`);document.body.classList.toggle("reduce-motion",!!st.reduceMotion)
}
function clickSound(){
  if(!state?.settings.sound)return;try{const A=window.AudioContext||window.webkitAudioContext,ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=460;g.gain.value=.025;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.035)}catch(e){}
}
function toast(msg,type=""){
  const el=document.createElement("div");el.className=`toast ${type}`;el.textContent=msg;document.getElementById("toasts").appendChild(el);setTimeout(()=>el.remove(),2600)
}
function autoSave(){if(!state)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));document.getElementById("continueBtn")?.classList.remove("hidden")}catch(e){toast("本地存档空间不足，请导出存档。","bad")}}
function reviveState(data){
  if(!data||data.version!==VERSION||!data.player||!data.inventory||!data.world)throw new Error("存档格式不兼容");
  data=deepClone(data);
  const fresh=freshState();state=Object.assign(fresh,data);state.player=Object.assign(fresh.player,data.player);state.player.stats=Object.assign(fresh.player.stats,data.player.stats||{});state.settings=Object.assign(fresh.settings,data.settings||{});
  state.relations=Object.assign(defaultRelations(),data.relations||{});state.gear=Object.assign(blankGear(),data.gear||{});state.fort=Object.assign(fresh.fort,data.fort||{});state.world.entered=state.world.entered||{};return state;
}
function loadAuto(){try{reviveState(JSON.parse(localStorage.getItem(SAVE_KEY)));showGame();toast("已读取自动存档。","good")}catch(e){toast("没有可读取的自动存档。","bad")}}
function manualSave(slot){try{localStorage.setItem(SLOT_PREFIX+slot,JSON.stringify(state));toast(`已写入手动存档 ${slot}`,"good")}catch(e){toast("保存失败。","bad")}}
function manualLoad(slot){try{reviveState(JSON.parse(localStorage.getItem(SLOT_PREFIX+slot)));closeModal();showGame();toast(`已读取手动存档 ${slot}`,"good")}catch(e){toast("该栏为空或存档损坏。","bad")}}
function encodeSave(data){return btoa(unescape(encodeURIComponent(JSON.stringify(data))))}
function decodeSave(text){return JSON.parse(decodeURIComponent(escape(atob(text.trim()))))}
function exportSave(){const text=encodeSave({kind:"汴河夜雨存档",version:VERSION,state,meta});showModal("导出存档",`<p>复制下方文本，通过微信发送给朋友。对方导入后即可继续。</p><textarea class="save-text" id="saveText">${text}</textarea><button class="btn primary" id="copySave">复制存档文本</button>`);document.getElementById("copySave").onclick=()=>copyText(text,"存档文本已复制")}
function importSave(){showModal("导入存档",`<p>粘贴完整存档文本。导入会覆盖当前自动存档，但不会删除手动存档。</p><textarea class="save-text" id="importText" placeholder="在此粘贴……"></textarea><button class="btn primary" id="doImport">校验并导入</button>`);document.getElementById("doImport").onclick=()=>{try{const p=decodeSave(document.getElementById("importText").value);if(p.kind!=="汴河夜雨存档"||p.version!==VERSION)throw 0;reviveState(p.state);meta=Object.assign(meta,p.meta||{});saveMeta();autoSave();closeModal();showGame();toast("存档导入成功。","good")}catch(e){toast("存档文本无效或版本不兼容。","bad")}}}
function copySummary(){
  if(!state)return;const text=`【汴河夜雨·江湖战报】\n${state.player.name}「${state.player.title}」｜${ORIGINS[state.player.origin].name}·${SCHOOLS[state.player.school].name}\nLv.${state.player.level}｜${REALMS[state.player.realm]}｜${STORY[state.node]?.chapter||"终局"}\n侠义 ${state.player.stats.chivalry}｜恶名 ${state.player.stats.notoriety}｜财富 ${state.player.stats.wealth}\n战斗胜利 ${state.battleWins}｜副本 ${Object.values(state.dungeons).reduce((n,x)=>n+x.clears,0)}｜成就 ${state.achievements.length}\n近日履历：${state.history.slice(-3).map(x=>x.text).join("；")}\n非官方同人作品《汴河夜雨》`;
  copyText(text,"冒险摘要已复制，可粘贴到微信聊天。");
}
function copyText(text,msg){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg,"good")).catch(()=>fallbackCopy(text,msg));else fallbackCopy(text,msg)}
function fallbackCopy(text,msg){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast(msg,"good")}

function showCreator(reset=false){
  if(reset){state=null;creatorData={step:1,origin:null,school:null}}
  document.getElementById("landing").classList.add("hidden");document.getElementById("game").classList.add("hidden");document.getElementById("creator").classList.remove("hidden");renderCreator()
}
function renderCreator(){
  const step=creatorData.step;document.getElementById("stepMark").textContent=["一 / 三","二 / 三","三 / 三"][step-1];document.getElementById("creatorTitle").textContent=["写下名姓","选择出身","择定流派"][step-1];
  [1,2,3].forEach(i=>document.getElementById(`creatorStep${i}`).classList.toggle("hidden",i!==step));document.getElementById("creatorPrev").disabled=step===1;document.getElementById("creatorNext").textContent=step===3?"执笔开篇":"下一步";
  document.getElementById("originChoices").innerHTML=Object.entries(ORIGINS).map(([id,o])=>`<button class="choice-card ${creatorData.origin===id?"selected":""}" data-origin="${id}"><b>${o.name}</b><span>${o.desc}</span></button>`).join("");
  document.getElementById("schoolChoices").innerHTML=Object.entries(SCHOOLS).map(([id,s])=>`<button class="choice-card ${creatorData.school===id?"selected":""}" data-school="${id}"><b>${s.name}</b><span>${s.role}<br>${s.mechanic}</span></button>`).join("");
  document.querySelectorAll("[data-origin]").forEach(b=>b.onclick=()=>{creatorData.origin=b.dataset.origin;renderCreator()});document.querySelectorAll("[data-school]").forEach(b=>b.onclick=()=>{creatorData.school=b.dataset.school;renderCreator()})
}
function creatorNext(){
  if(creatorData.step===1){
    if(!document.getElementById("charName").value.trim()){toast("请先写下角色姓名。","bad");return}
    creatorData.step=2;renderCreator();return
  }
  if(creatorData.step===2){if(!creatorData.origin){toast("请选择一种出身。","bad");return}creatorData.step=3;renderCreator();return}
  if(!creatorData.school){toast("请选择一种战斗流派。","bad");return}
  state=freshState();const g=document.getElementById("charGender").value;
  state.player.name=document.getElementById("charName").value.trim();state.player.gender=g==="自定义"?(document.getElementById("charCustomGender").value.trim()||"江湖中人"):g;
  state.player.look=document.getElementById("charLook").value.trim()||"风尘仆仆，目光清亮";state.player.title=document.getElementById("charTitle").value.trim()||"听雨客";state.player.origin=creatorData.origin;state.player.school=creatorData.school;
  applyOriginAndSchool();addHistory("在汴河夜雨中踏入江湖。");autoSave();showGame()
}
function showGame(){
  document.getElementById("landing").classList.add("hidden");document.getElementById("creator").classList.add("hidden");document.getElementById("game").classList.remove("hidden");document.getElementById("sceneArea").innerHTML=`<section class="scene"><div class="chapter-kicker" id="chapterKicker"></div><h1 id="sceneTitle"></h1><div class="story-text" id="storyText"></div><div class="delta-log" id="deltaLog"></div></section><section class="choices" id="choices"></section>`;
  clearInterval(playTimer);playTimer=setInterval(()=>{if(state){state.playSeconds=(state.playSeconds||0)+30;autoSave()}},30000);if(state.currentEnding)endGame(state.currentEnding);else render()
}

document.getElementById("newGameBtn").onclick=()=>showCreator(true);document.getElementById("continueBtn").onclick=loadAuto;
document.getElementById("creatorBack").onclick=()=>{document.getElementById("creator").classList.add("hidden");document.getElementById("landing").classList.remove("hidden")};
document.getElementById("creatorPrev").onclick=()=>{creatorData.step=Math.max(1,creatorData.step-1);renderCreator()};document.getElementById("creatorNext").onclick=creatorNext;
document.getElementById("charGender").onchange=e=>document.getElementById("customGenderWrap").classList.toggle("hidden",e.target.value!=="自定义");
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openPanel(b.dataset.open));document.getElementById("modalClose").onclick=closeModal;document.getElementById("modalWrap").onclick=e=>{if(e.target.id==="modalWrap")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
if(localStorage.getItem(SAVE_KEY))document.getElementById("continueBtn").classList.remove("hidden");
applySettings();
window.__BIANHE_TEST__={
  freshState,STORY,SCHOOLS,NPCS,DUNGEONS,ACHIEVEMENTS,ENDINGS,EQUIPMENT_DB,ITEMS,ENEMIES,
  conditionResult,reviveState,enterNode,startBattle,battleAction,equipItem,unequipItem,useItem,
  completeDungeon,resolveEnding,applyEffects,fortAction,doBreakthrough,realmNeed,manualSave,manualLoad,
  autoSave,loadAuto,unlockAchievement,getState:()=>state,setState:x=>{state=x}
};
})();
</script>
</body>
</html>
